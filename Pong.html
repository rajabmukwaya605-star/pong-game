<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Pong</title>
<style>
:root{--bg:#0e2a22;--felt:#14402f;--line:#e9efe8;--ball:#ffb703;--you:#e9efe8;--cpu:#8fd3b6;--text:#e9efe8;--muted:#9bb8aa;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0a1f19}}
:root[data-theme="dark"]{--bg:#0a1f19}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%}
body{background:var(--bg);color:var(--text);font-family:"Trebuchet MS",Verdana,sans-serif;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;padding:16px;min-height:100vh}
.score{display:flex;gap:28px;align-items:baseline;font-size:15px;color:var(--muted)}
.score b{font-size:44px;color:var(--text);font-variant-numeric:tabular-nums;min-width:1.2ch;text-align:center;font-family:Georgia,serif}
canvas{width:100%;max-width:800px;aspect-ratio:8/5;background:var(--felt);border:3px solid var(--line);border-radius:6px;cursor:none;touch-action:none;display:block}
p{margin:0;font-size:14px;color:var(--muted);text-align:center;max-width:60ch}
:focus-visible{outline:2px solid var(--ball);outline-offset:3px}
</style>
</head>
<body>
<div class="score" aria-live="polite">
  <span>You</span><b id="s1">0</b><b id="s2">0</b><span>Computer</span>
</div>
<canvas id="c" width="800" height="500" tabindex="0" aria-label="Pong game"></canvas>
<p>Move your mouse or press ↑ / ↓ to control the left paddle. Click or press Space to serve and pause. First to 7 wins.</p>
<script>
(function(){
  var cv=document.getElementById('c'),ctx=cv.getContext('2d'),W=800,H=500;
  var el1=document.getElementById('s1'),el2=document.getElementById('s2');
  var PW=12,PH=84,WIN=7,MAXV=640;
  var css=getComputedStyle(document.documentElement);
  function col(n){return css.getPropertyValue(n).trim()}
  var p={y:H/2-PH/2},ai={y:H/2-PH/2},ball,score=[0,0],state='ready',msg='Click or press Space to serve',keys={},serveDir=1,last=0;

  function resetBall(dir){
    ball={x:W/2,y:H/2,r:8,vx:0,vy:0,speed:340};
    serveDir=dir;
  }
  function serve(){
    var a=(Math.random()*0.8-0.4);
    ball.vx=Math.cos(a)*ball.speed*serveDir;
    ball.vy=Math.sin(a)*ball.speed;
    state='playing';msg='';
  }
  function reset(){score=[0,0];upd();resetBall(1);state='ready';msg='Click or press Space to serve'}
  function upd(){el1.textContent=score[0];el2.textContent=score[1]}
  function clamp(v,a,b){return Math.max(a,Math.min(b,v))}

  function hitPaddle(py,dir){
    // dir: 1 = bounce to the right (left paddle), -1 = bounce to the left
    var rel=clamp((ball.y-(py+PH/2))/(PH/2),-1,1);
    ball.speed=Math.min(MAXV,ball.speed*1.06);
    var ang=rel*Math.PI/3.2;
    ball.vx=Math.cos(ang)*ball.speed*dir;
    ball.vy=Math.sin(ang)*ball.speed;
  }

  function step(dt){
    if(keys.ArrowUp)p.y-=480*dt;
    if(keys.ArrowDown)p.y+=480*dt;
    p.y=clamp(p.y,0,H-PH);
    if(state!=='playing'){return}

    // computer paddle: tracks the ball with limited speed and a small aim error
    var target=ball.vx>0?ball.y-PH/2+Math.sin(performance.now()/400)*18:H/2-PH/2;
    var d=target-ai.y,maxMove=300*dt;
    ai.y+=clamp(d,-maxMove,maxMove);
    ai.y=clamp(ai.y,0,H-PH);

    ball.x+=ball.vx*dt;ball.y+=ball.vy*dt;

    // wall collisions
    if(ball.y-ball.r<0){ball.y=ball.r;ball.vy=Math.abs(ball.vy)}
    if(ball.y+ball.r>H){ball.y=H-ball.r;ball.vy=-Math.abs(ball.vy)}

    // paddle collisions
    var lx=24+PW,rx=W-24-PW;
    if(ball.vx<0&&ball.x-ball.r<=lx&&ball.x-ball.r>=24-ball.r&&ball.y>=p.y-ball.r&&ball.y<=p.y+PH+ball.r){
      ball.x=lx+ball.r;hitPaddle(p.y,1);
    }
    if(ball.vx>0&&ball.x+ball.r>=rx&&ball.x+ball.r<=W-24+ball.r&&ball.y>=ai.y-ball.r&&ball.y<=ai.y+PH+ball.r){
      ball.x=rx-ball.r;hitPaddle(ai.y,-1);
    }

    // scoring
    if(ball.x<-ball.r){point(1)}
    else if(ball.x>W+ball.r){point(0)}
  }

  function point(who){
    score[who]++;upd();
    if(score[who]>=WIN){state='over';msg=(who===0?'You win!':'Computer wins.')+' Click or press Space to play again';resetBall(1);return}
    resetBall(who===0?-1:1);
    state='ready';msg=(who===0?'You scored.':'Computer scored.')+' Click or press Space to serve';
  }

  function draw(){
    ctx.clearRect(0,0,W,H);
    ctx.strokeStyle=col('--line');ctx.globalAlpha=.45;ctx.lineWidth=3;ctx.setLineDash([14,14]);
    ctx.beginPath();ctx.moveTo(W/2,0);ctx.lineTo(W/2,H);ctx.stroke();
    ctx.setLineDash([]);ctx.globalAlpha=1;
    ctx.fillStyle=col('--you');ctx.fillRect(24,p.y,PW,PH);
    ctx.fillStyle=col('--cpu');ctx.fillRect(W-24-PW,ai.y,PW,PH);
    ctx.fillStyle=col('--ball');ctx.beginPath();ctx.arc(ball.x,ball.y,ball.r,0,Math.PI*2);ctx.fill();
    if(msg){
      ctx.fillStyle=col('--text');ctx.font='20px "Trebuchet MS",Verdana,sans-serif';ctx.textAlign='center';
      ctx.fillText(msg,W/2,H-34);
    }
  }

  function loop(t){
    var dt=Math.min((t-last)/1000,0.03);last=t;
    if(state!=='paused')step(dt);
    draw();requestAnimationFrame(loop);
  }

  function action(){
    if(state==='ready')serve();
    else if(state==='over')reset();
    else if(state==='playing'){state='paused';msg='Paused. Click or press Space to resume'}
    else if(state==='paused'){state='playing';msg=''}
  }

  function moveTo(clientY){
    var r=cv.getBoundingClientRect();
    p.y=clamp((clientY-r.top)*(H/r.height)-PH/2,0,H-PH);
  }
  cv.addEventListener('mousemove',function(e){moveTo(e.clientY)});
  cv.addEventListener('pointermove',function(e){if(e.pointerType==='touch')moveTo(e.clientY)});
  cv.addEventListener('click',action);
  window.addEventListener('keydown',function(e){
    if(e.key==='ArrowUp'||e.key==='ArrowDown'){keys[e.key]=true;e.preventDefault()}
    else if(e.key===' '){e.preventDefault();if(!e.repeat)action()}
  });
  window.addEventListener('keyup',function(e){keys[e.key]=false});

  resetBall(1);upd();requestAnimationFrame(loop);
})();
</script>
</body>
</html>
